# Copy into the TEST TARGET repository at .github/workflows/ai-e2e.yml
# Requires: npm dependencies including @playwright/test, tests/generated.spec.ts,
# and a working `npm run dev` command. Customize the start command for your app.
name: Generated E2E
on:
  workflow_dispatch:
  pull_request:
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run dev -- --host 127.0.0.1 > /tmp/app.log 2>&1 &
      - run: npx wait-on http://127.0.0.1:3000
      - run: npx playwright test tests/generated.spec.ts
        env:
          TEST_BASE_URL: http://127.0.0.1:3000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
