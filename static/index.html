<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AutoTest AI | MVP</title><style>
:root{font-family:system-ui,sans-serif;color:#182438;background:#f4f7fb}*{box-sizing:border-box}main{max-width:1000px;margin:45px auto;padding:0 20px}h1{font-size:32px}p{color:#526174;line-height:1.7}.panel{background:white;border:1px solid #dce4ef;border-radius:14px;padding:24px;margin:20px 0;box-shadow:0 3px 12px #1d33500a}label{display:block;font-weight:650;margin:14px 0 6px}input{width:100%;padding:13px;border:1px solid #b9c8da;border-radius:8px;font-size:15px}button{background:#2458db;color:white;border:0;border-radius:8px;padding:12px 20px;cursor:pointer;margin-top:18px;font-weight:650}button:disabled{opacity:.5;cursor:wait}button.secondary{background:#23334c}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid #e4eaf2;padding:12px;text-align:left;font-size:14px}th{color:#54677e}code{overflow-wrap:anywhere}#error{color:#b42318}small{color:#66758a}.tag{border-radius:20px;background:#eef2ff;padding:4px 8px;font-size:12px} @media(max-width:650px){main{margin:15px auto}table{display:block;overflow:auto}}
</style></head><body><main><h1>AutoTest AI <span class="tag">MVP</span></h1><p>公開GitHubリポジトリを静的解析し、テスト候補とPlaywrightのスモークテストを生成します。コードの実行・送信は行いません。</p><section class="panel"><form id="form"><label for="repo">GitHubリポジトリURL</label><input id="repo" type="url" required placeholder="https://github.com/owner/repo"><label for="branch">ブランチ（省略時はデフォルト）</label><input id="branch" placeholder="main"><button id="analyze">解析する</button></form><p id="error" role="alert"></p></section><section id="result" class="panel" hidden><h2>解析結果</h2><p id="summary"></p><p id="warnings"></p><h3>テスト候補</h3><table><thead><tr><th>ID</th><th>種別</th><th>内容</th><th>対象</th><th>ソース</th></tr></thead><tbody id="cases"></tbody></table><label for="base">テスト対象の起動URL</label><input id="base" value="http://localhost:3000"><button class="secondary" id="export">Playwrightテストをダウンロード</button><p><small>生成するのは画面のスモークテストのみ。フォーム/APIのテスト候補は期待値が未確定のため自動実行しません。</small></p></section></main><script>
const $ = id => document.getElementById(id);let latest=null;
$('form').addEventListener('submit',async e=>{e.preventDefault();$('error').textContent='';$('result').hidden=true;$('analyze').disabled=true;try{const res=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({repo_url:$('repo').value,branch:$('branch').value})});const data=await res.json();if(!res.ok)throw Error(data.detail||'解析に失敗しました');latest=data;$('summary').textContent=`${data.repo} / 解析ファイル: ${data.scanned_files} / 画面ルート: ${data.routes.length} / 候補: ${data.cases.length}`;$('warnings').textContent=data.warnings.join(' ');$('cases').replaceChildren();for(const c of data.cases){const tr=document.createElement('tr');for(const v of [c.id,c.kind,c.title,c.path,c.source]){const td=document.createElement('td');td.textContent=v;tr.append(td)}$('cases').append(tr)}$('result').hidden=false}catch(err){$('error').textContent=err.message}finally{$('analyze').disabled=false}});
$('export').addEventListener('click',async()=>{if(!latest)return;const res=await fetch('/api/export',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cases:latest.cases,base_url:$('base').value})});if(!res.ok){alert('エクスポート失敗');return}const blob=await res.blob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='generated.spec.ts';a.click();URL.revokeObjectURL(url)});
</script></body></html>
